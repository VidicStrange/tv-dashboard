<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Dashboard</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: #0b0f17;
    background: linear-gradient(135deg, #0b0f17 0%, #111a2b 60%, #0d1320 100%);
    color: #e8edf5;
    font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { position: absolute; top: 4vh; left: 4vw; right: 4vw; bottom: 4vh;
          display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .top { display: -webkit-flex; display: flex; -webkit-align-items: flex-start; align-items: flex-start; }
  .clock { -webkit-flex: 1; flex: 1; }
  .time { font-size: 13vh; font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
  .date { font-size: 3.4vh; color: #9fb0c8; margin-top: 1.2vh; }
  .side { text-align: right; }
  .now { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: flex-end; justify-content: flex-end; }
  .temp { font-size: 10vh; font-weight: 300; line-height: 1; }
  .cond { font-size: 3.2vh; margin-left: 2vw; text-align: left; }
  .cond small { display: block; color: #9fb0c8; font-size: 2.4vh; margin-top: 0.6vh; }
  .city { font-size: 2.2vh; color: #6f819b; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 1vh; }
  .fc { display: -webkit-flex; display: flex; -webkit-justify-content: flex-end; justify-content: flex-end; margin-top: 2vh; }
  .fc div { margin-left: 2.4vw; text-align: center; font-size: 2.3vh; color: #c7d2e2; }
  .fc b { display: block; font-weight: 400; color: #6f819b; font-size: 2vh; margin-bottom: 0.5vh; }
  .fx { margin-top: 3vh; display: -webkit-inline-flex; display: inline-flex; -webkit-align-items: baseline; align-items: baseline;
        background: rgba(255,255,255,0.05); border-radius: 1.2vh; padding: 1.2vh 1.6vw; }
  .fx .pair { font-size: 2.2vh; color: #9fb0c8; margin-right: 1vw; letter-spacing: 0.1em; }
  .fx .rate { font-size: 4.6vh; font-weight: 400; }
  .fx .chg { font-size: 2.2vh; margin-left: 1vw; }
  .up { color: #6fd39a; } .down { color: #f08a7e; } .flat { color: #9fb0c8; }
  .aff { margin-top: 3.5vh; text-align: center; font-size: 3.3vh; font-style: italic; font-weight: 300; color: #e2cfa0; letter-spacing: 0.01em; }
  .aff:before, .aff:after { content: ''; display: inline-block; width: 4vw; height: 1px; background: rgba(226,207,160,0.35); vertical-align: middle; margin: 0 1.5vw; }
  .news { -webkit-flex: 1; flex: 1; margin-top: 4vh; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 3vh; overflow: hidden; position: relative; }
  .news h2 { margin: 0 0 2vh 0; font-size: 2.2vh; font-weight: 500; color: #6f819b; text-transform: uppercase; letter-spacing: 0.2em; }
  .item { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; margin-bottom: 2.1vh; }
  .src { -webkit-flex: none; flex: none; width: 9vw; font-size: 1.9vh; color: #7fa7e0; text-transform: uppercase; letter-spacing: 0.08em; }
  .ttl { font-size: 3vh; line-height: 1.25; color: #e8edf5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fade { -webkit-transition: opacity 0.8s; transition: opacity 0.8s; }
  .foot { font-size: 1.7vh; color: #4f5e74; margin-top: 1vh; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="clock">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date"></div>
      <div class="fx" id="fx"><span class="pair">USD / CNY</span><span class="rate" id="rate">…</span><span class="chg flat" id="chg"></span></div>
    </div>
    <div class="side">
      <div class="city">Shanghai</div>
      <div class="now">
        <div class="temp" id="temp">--°</div>
        <div class="cond" id="cond">Loading…<small></small></div>
      </div>
      <div class="fc" id="fc"></div>
    </div>
  </div>
  <div class="aff" id="aff"></div>
  <div class="news">
    <h2>Tech news</h2>
    <div id="list" class="fade"></div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
(function () {
  var TZ_OFFSET = 8; // Shanghai, UTC+8 (no DST)
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var status = {};

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function shNow() { var d = new Date(); return new Date(d.getTime() + d.getTimezoneOffset() * 60000 + TZ_OFFSET * 3600000); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function getJSON(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 15000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try { ok(JSON.parse(x.responseText)); } catch (e) { fail && fail(e); }
      } else { fail && fail(x.status); }
    };
    x.ontimeout = function () { fail && fail('timeout'); };
    x.send();
  }

  function setFoot() {
    var parts = [];
    for (var k in status) parts.push(k + ' ' + status[k]);
    $('foot').innerHTML = esc(parts.join('  ·  '));
  }

  // ---------- clock ----------
  function tick() {
    var d = shNow();
    $('time').innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('date').innerHTML = DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  }

  // ---------- weather (Open-Meteo) ----------
  function wtext(c) {
    if (c === 0) return 'Clear';
    if (c === 1) return 'Mostly clear';
    if (c === 2) return 'Partly cloudy';
    if (c === 3) return 'Overcast';
    if (c === 45 || c === 48) return 'Fog';
    if (c >= 51 && c <= 57) return 'Drizzle';
    if (c >= 61 && c <= 67) return 'Rain';
    if (c >= 71 && c <= 77) return 'Snow';
    if (c >= 80 && c <= 82) return 'Showers';
    if (c >= 85 && c <= 86) return 'Snow showers';
    if (c >= 95) return 'Thunderstorm';
    return '—';
  }
  function loadWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=31.23&longitude=121.47' +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=Asia%2FShanghai&forecast_days=4';
    getJSON(url, function (j) {
      var c = j.current;
      $('temp').innerHTML = Math.round(c.temperature_2m) + '°';
      $('cond').innerHTML = esc(wtext(c.weather_code)) +
        '<small>Feels ' + Math.round(c.apparent_temperature) + '° · ' + c.relative_humidity_2m + '% · ' + Math.round(c.wind_speed_10m) + ' km/h</small>';
      var h = '';
      for (var i = 1; i < j.daily.time.length; i++) {
        var p = j.daily.time[i].split('-');
        var dd = new Date(+p[0], +p[1] - 1, +p[2]);
        var rain = j.daily.precipitation_probability_max ? j.daily.precipitation_probability_max[i] : null;
        h += '<div><b>' + DAYS[dd.getDay()] + '</b>' + Math.round(j.daily.temperature_2m_max[i]) + '° / ' +
             Math.round(j.daily.temperature_2m_min[i]) + '°<br>' + esc(wtext(j.daily.weather_code[i])) +
             (rain !== null && rain >= 30 ? ' ' + rain + '%' : '') + '</div>';
      }
      $('fc').innerHTML = h;
      status.weather = 'ok'; setFoot();
    }, function () { status.weather = 'offline'; setFoot(); });
  }

  // ---------- USD/CNY ----------
  var lastRate = null;
  function showRate(r, src) {
    $('rate').innerHTML = r.toFixed(4);
    var el = $('chg');
    if (lastRate !== null && Math.abs(r - lastRate) > 0.00005) {
      var diff = r - lastRate;
      el.className = 'chg ' + (diff > 0 ? 'up' : 'down');
      el.innerHTML = (diff > 0 ? '+' : '') + diff.toFixed(4);
    }
    lastRate = r;
    status.fx = src; setFoot();
  }
  function loadRate() {
    getJSON('https://open.er-api.com/v6/latest/USD', function (j) {
      if (j && j.rates && j.rates.CNY) showRate(j.rates.CNY, 'er-api');
    }, function () {
      getJSON('https://api.frankfurter.app/latest?from=USD&to=CNY', function (j) {
        if (j && j.rates && j.rates.CNY) showRate(j.rates.CNY, 'ECB');
      }, function () { status.fx = 'offline'; setFoot(); });
    });
  }

  // ---------- news ----------
  var news = [], page = 0, PER_PAGE = 7;

  function addItems(items) {
    var seen = {};
    for (var i = 0; i < news.length; i++) seen[news[i].t.toLowerCase()] = 1;
    for (var k = 0; k < items.length; k++) {
      var key = items[k].t.toLowerCase();
      if (!seen[key]) { news.push(items[k]); seen[key] = 1; }
    }
    news.sort(function (a, b) { return b.d - a.d; });
    if (news.length > 42) news.length = 42;
    render();
  }
  function parseDate(s) { var t = Date.parse(String(s).replace(' ', 'T')); return isNaN(t) ? 0 : t; }

  function loadNews() {
    var fresh = [];
    var pending = 2;
    function done() {
      pending--;
      if (pending === 0) {
        if (fresh.length) { news = []; addItems(fresh); status.news = fresh.length + ' items'; }
        else status.news = 'offline';
        setFoot();
      }
    }
    // news.json is refreshed hourly by a GitHub Action in this repo (same origin, works from China)
    getJSON('news.json?t=' + Date.now(), function (j) {
      if (j && j.items) {
        for (var i = 0; i < j.items.length; i++) {
          fresh.push({ s: j.items[i].s, t: j.items[i].t, d: j.items[i].d * 1000 });
        }
      }
      done();
    }, done);
    // Hacker News via Algolia (works when RSS proxy is unreachable)
    getJSON('https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=8', function (j) {
      if (j && j.hits) {
        for (var i = 0; i < j.hits.length; i++) {
          fresh.push({ s: 'Hacker News', t: j.hits[i].title, d: (j.hits[i].created_at_i || 0) * 1000 });
        }
      }
      done();
    }, done);
  }

  function render() {
    if (!news.length) return;
    var pages = Math.ceil(news.length / PER_PAGE);
    if (page >= pages) page = 0;
    var slice = news.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);
    var h = '';
    for (var i = 0; i < slice.length; i++) {
      h += '<div class="item"><div class="src">' + esc(slice[i].s) + '</div><div class="ttl">' + esc(slice[i].t) + '</div></div>';
    }
    var list = $('list');
    list.style.opacity = 0;
    setTimeout(function () { list.innerHTML = h; list.style.opacity = 1; }, 800);
  }
  function nextPage() { if (news.length > PER_PAGE) { page++; render(); } }

  // ---------- daily affirmation ----------
  var AFF = ["Деньги — это энергия моих решений. Сегодня я принимаю их спокойно и точно.",
    "Я строю дело, которое сильнее моих сомнений.",
    "Каждый мой шаг сегодня — инвестиция в человека, которым я становлюсь.",
    "Я управляю деньгами, а не они мной.",
    "Познавая себя, я понимаю, чего на самом деле хочу.",
    "Мой масштаб определяется вопросами, которые я задаю себе.",
    "Я спокойно отношусь к риску: это плата за рост.",
    "Богатство начинается с ясного мышления и дисциплины.",
    "Я благодарен за то, что имею, и открыт для большего.",
    "Ошибка — это опыт, а не приговор.",
    "Я выбираю долгую игру: репутация, знания, доверие.",
    "Моя сила — оставаться собой в любой стране и на любом языке.",
    "Я замечаю свои мысли и выбираю те, что ведут вперёд.",
    "Ценность, которую я создаю для других, возвращается ко мне.",
    "Тишина и размышление — тоже работа.",
    "Я учусь у каждого человека, с которым веду переговоры.",
    "Мои границы — основа моей свободы.",
    "Деньги приумножаются там, где есть порядок.",
    "Я действую, даже когда нет полной уверенности.",
    "Я знаю свои сильные стороны и усиливаю их каждый день.",
    "Успех — это сумма маленьких обещаний, выполненных перед собой.",
    "Я сравниваю себя только со вчерашним собой.",
    "Моё тело и разум — главный капитал. Я забочусь о них.",
    "Я думаю как владелец, а не как исполнитель.",
    "Спокойствие — моё конкурентное преимущество.",
    "Я выбираю смысл, а не суету.",
    "Новые горизонты меня не пугают, а вдохновляют.",
    "Честность с собой экономит мне годы.",
    "Каждый день я становлюсь чуть мудрее, чем вчера.",
    "Мои решения создают мою свободу.",
    "Изобилие — естественное следствие труда и ясности."];
  var affDay = -1;
  function showAff() {
    var d = shNow();
    var start = new Date(d.getFullYear(), 0, 0);
    var day = Math.floor((d - start) / 86400000);
    if (day === affDay) return;
    affDay = day;
    $('aff').innerHTML = esc(AFF[(day + d.getFullYear()) % AFF.length]);
  }

  // ---------- start ----------
  tick(); setInterval(tick, 10000);
  showAff(); setInterval(showAff, 60000);
  loadWeather(); setInterval(loadWeather, 20 * 60000);
  loadRate();    setInterval(loadRate, 30 * 60000);
  loadNews();    setInterval(loadNews, 30 * 60000);
  setInterval(nextPage, 15000);
  // full reload every 6 hours to keep the old WebView fresh
  setTimeout(function () { location.reload(); }, 6 * 3600000);
})();
</script>
</body>
</html>
