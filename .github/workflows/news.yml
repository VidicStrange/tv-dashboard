name: Update tech news

on:
  schedule:
    - cron: "7 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RSS feeds
        run: |
          python3 - <<'EOF'
          import json, urllib.request, xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          from datetime import datetime, timezone

          FEEDS = [
              ("The Verge", "https://www.theverge.com/rss/index.xml"),
              ("Engadget", "https://www.engadget.com/rss.xml"),
              ("GSMArena", "https://www.gsmarena.com/rss-news-reviews.php3"),
              ("Ars", "https://feeds.arstechnica.com/arstechnica/gadgets"),
              ("9to5Mac", "https://9to5mac.com/feed/"),
          ]
          ATOM = "{http://www.w3.org/2005/Atom}"

          def ts(s):
              if not s:
                  return 0
              try:
                  return int(parsedate_to_datetime(s).timestamp())
              except Exception:
                  pass
              try:
                  return int(datetime.fromisoformat(s.replace("Z", "+00:00")).timestamp())
              except Exception:
                  return 0

          items = []
          for name, url in FEEDS:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 tv-dashboard"})
                  root = ET.fromstring(urllib.request.urlopen(req, timeout=20).read())
                  entries = root.findall(".//item") or root.findall(f".//{ATOM}entry")
                  for e in entries[:10]:
                      title = (e.findtext("title") or e.findtext(f"{ATOM}title") or "").strip()
                      date = e.findtext("pubDate") or e.findtext(f"{ATOM}updated") or e.findtext(f"{ATOM}published")
                      if title:
                          items.append({"s": name, "t": title, "d": ts(date)})
                  print(name, "ok")
              except Exception as ex:
                  print(name, "failed:", ex)

          items.sort(key=lambda x: x["d"], reverse=True)
          out = {"updated": int(datetime.now(timezone.utc).timestamp()), "items": items[:40]}
          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False)
          EOF
      - name: Commit
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update news"
          git push
